name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild (for example v0.2.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-2022
            platform: win
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node -e "if(process.env.RELEASE_TAG !== 'v'+require('./package.json').version) process.exit(1)"
      - run: npm ci
      - run: node scripts/test-ci.cjs
      - run: npm run build
      - name: Desktop and PTY smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
      - name: Desktop and PTY smoke test
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Build installers
        if: runner.os != 'macOS'
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Build Mac installers
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ vars.MAC_CSC_NAME }}
        shell: bash
        run: |
          signing=()
          if [[ -n "$CSC_LINK" ]]; then
            : "${CSC_NAME:?Set MAC_CSC_NAME to the Developer ID certificate name or team ID}"
            signing+=("-c.mac.identity=$CSC_NAME" "-c.mac.hardenedRuntime=true" "-c.forceCodeSigning=true")
          fi
          npx electron-builder --mac --${{ matrix.arch }} --publish never "${signing[@]}"
      - name: Test packaged desktop app (Linux)
        if: runner.os == 'Linux'
        env:
          ORBIT_PACKAGED: '1'
        run: xvfb-run -a npm run smoke
      - name: Test packaged desktop app
        if: runner.os != 'Linux'
        env:
          ORBIT_PACKAGED: '1'
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            out/*.exe
            out/*.dmg
            out/*.zip
            out/*.AppImage
            out/*.deb
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: orbit-*
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/checksums.cjs installers
      - name: Publish release and all installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Orbit Terminal $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" installers/* --clobber
