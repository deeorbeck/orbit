name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Desktop and PTY smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
      - name: Desktop and PTY smoke test
        if: runner.os != 'Linux'
        run: npm run smoke
